<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Tr&#233;nink&#225;&#269; Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0C1220;
  --surface:     #141E30;
  --elevated:    #1A2640;
  --border-sub:  #1C2E48;
  --border:      #253858;
  --accent:      #05D9A4;
  --accent-dim:  rgba(5,217,164,0.10);
  --accent-glow: rgba(5,217,164,0.18);
  --text:        #CDD8EE;
  --text-sec:    #6B7FA0;
  --text-muted:  #3F526E;
  --alert:       #FF6B6B;
  --race:        #7B9EFF;
  --sick:        #FFBA5A;
  --val-dz:      #7FBEEE;
  --val-fa:      #A8D5B5;
  --cycle-row:   #111C2C;
  --week-row:    #0E1624;
  --hover:       rgba(255,255,255,0.05);
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  line-height: 1.4;
}

/* Setup */
#setup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 18px;
  padding: 40px;
}

#setup .logo-mark {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
}

#setup h1 {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.4px;
}

#setup p {
  color: var(--text-sec);
  text-align: center;
  max-width: 420px;
  line-height: 1.65;
  font-size: 13px;
}

#setup p code {
  color: var(--accent);
  font-family: 'SF Mono', 'Consolas', monospace;
  font-size: 11.5px;
}

.input-row {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 600px;
}

input[type="text"] {
  flex: 1;
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 11.5px;
  font-family: 'SF Mono', 'Consolas', monospace;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

input[type="text"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

button {
  background: var(--accent);
  border: none;
  border-radius: 6px;
  color: #081018;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 20px;
  transition: opacity 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}

button:hover { opacity: 0.88; box-shadow: 0 0 14px var(--accent-glow); }
button:active { opacity: 0.72; }

button.ghost {
  background: var(--elevated);
  color: var(--text-sec);
  border: 1px solid var(--border);
  font-weight: 500;
}
button.ghost:hover { color: var(--text); border-color: var(--accent); box-shadow: none; }

.setup-error {
  color: var(--alert);
  font-size: 12px;
  min-height: 18px;
}

/* App shell */
#app {
  display: none;
  flex-direction: column;
  height: 100vh;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-sub);
  flex-shrink: 0;
}

.h-logo {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}

.h-sep { width: 1px; height: 14px; background: var(--border); }

.h-team { font-size: 12px; color: var(--text-sec); }

header .flex1 { flex: 1; }

.h-nav-link {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sec);
  text-decoration: none;
  padding: 3px 8px;
  border-radius: 5px;
  transition: background 0.15s, color 0.15s;
}
.h-nav-link:hover, .h-nav-link.active { background: var(--hover); color: var(--text); }

.h-season {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-size: 12px;
  padding: 2px 6px;
}

.h-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  padding: 5px 12px;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.h-btn:hover { color: var(--text-sec); background: var(--elevated); box-shadow: none; }

/* Body split */
.body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sidebar */
aside {
  width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border-sub);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.aside-label {
  padding: 12px 14px 8px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.athlete-list {
  flex: 1;
  overflow-y: auto;
}

.athlete-list::-webkit-scrollbar { width: 3px; }
.athlete-list::-webkit-scrollbar-track { background: transparent; }
.athlete-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ath-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 13px;
  cursor: pointer;
  transition: background 0.1s;
  user-select: none;
  position: relative;
}

.ath-item:hover { background: var(--elevated); }
.ath-item.active { background: var(--accent-dim); }

.ath-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 4px; bottom: 4px;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

.ath-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--elevated);
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800;
  color: var(--text-muted);
  flex-shrink: 0;
  transition: border-color 0.15s, color 0.15s;
}

.ath-item.active .ath-avatar { border-color: var(--accent); color: var(--accent); }

.ath-name {
  flex: 1;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ath-item.active .ath-name { color: var(--accent); }

.nezp-badge {
  flex-shrink: 0;
  background: var(--alert);
  border-radius: 10px;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 1px 6px;
  min-width: 20px;
  text-align: center;
}

.nezp-badge.zero    { background: var(--border);     color: var(--text-muted); font-weight: 500; }
.nezp-badge.loading { background: var(--border-sub); color: var(--text-muted); font-weight: 400; }

/* Main panel */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.main-head {
  padding: 13px 24px 11px;
  border-bottom: 1px solid var(--border-sub);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.ath-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.stat-pills { display: flex; gap: 7px; flex-wrap: wrap; }

.pill {
  background: var(--elevated);
  border: 1px solid var(--border-sub);
  border-radius: 4px;
  font-size: 11.5px;
  padding: 3px 9px;
  color: var(--text-sec);
  font-variant-numeric: tabular-nums;
}

.pill strong { color: var(--text); font-weight: 600; }

.pill.alert {
  border-color: rgba(255,107,107,0.3);
  background: rgba(255,107,107,0.07);
}
.pill.alert strong { color: var(--alert); }

/* Table */
.table-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
}

.table-wrap::-webkit-scrollbar { width: 5px; height: 5px; }
.table-wrap::-webkit-scrollbar-track { background: transparent; }
.table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

thead tr {
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}

thead th {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 8px 16px;
  text-align: right;
  white-space: nowrap;
  border-bottom: 1px solid var(--border-sub);
}

thead th.col-cy { text-align: left; min-width: 100px; }
thead th.col-wk { text-align: left; min-width: 60px; }

.cr {
  cursor: pointer;
  background: var(--cycle-row);
  border-top: 1px solid var(--border-sub);
  transition: background 0.1s;
  user-select: none;
}

.cr:hover { background: #172032; }

.cr td {
  padding: 9px 16px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
}

.cy-cell { display: flex; align-items: center; gap: 8px; }

.chevron {
  display: inline-block;
  font-size: 8px;
  color: var(--text-muted);
  transition: transform 0.18s ease;
  width: 10px;
  text-align: center;
}

.cr.open .chevron { transform: rotate(90deg); }

.cy-tag {
  font-size: 12px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: 0.05em;
}

.cr.has-nezp .cy-tag { color: var(--alert); }
.wr.has-nezp .wk-cell { color: var(--alert); }

.cy-dates {
  font-size: 10.5px;
  font-weight: 400;
  color: var(--text-muted);
  white-space: nowrap;
}

.cy-copy {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
  padding: 0 2px;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.15s, color 0.15s;
}
.cr:hover .cy-copy { opacity: 1; }
.cy-copy:hover { color: var(--accent); }

.wr { display: none; background: var(--week-row); }
.wr.show { display: table-row; }

.wr td {
  padding: 5px 16px;
  font-size: 12px;
  color: var(--text-sec);
  border-bottom: 1px solid rgba(28,46,72,0.5);
}

.wk-cell {
  padding-left: 20px !important;
  color: var(--text-muted);
  font-size: 11.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 5px;
}

.wk-chevron {
  display: inline-block;
  font-size: 7px;
  color: var(--text-muted);
  transition: transform 0.15s ease;
  width: 10px;
  text-align: center;
  flex-shrink: 0;
}

.wr.expandable { cursor: pointer; }
.wr.expandable:hover td { background: rgba(255,255,255,0.02); }
.wr.wk-open .wk-chevron { transform: rotate(90deg); }

/* Activity rows */
.ar { display: none; background: #090E18; }
.ar.show { display: table-row; }

.ar > td {
  padding: 4px 8px 4px 0;
  border-bottom: 1px solid rgba(22,36,58,0.7);
  vertical-align: middle;
}

/* Day-start: stronger top border to visually separate days */
.ar.day-start.show + .ar.show:not(.day-start),
.ar.show.day-start {
  border-top: 1px solid rgba(37,56,88,0.8);
}

.ar-date-cell {
  padding-left: 30px !important;
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  min-width: 72px;
}

.ar-detail-cell {
  padding-left: 4px !important;
}

.ar-detail-cell > * { vertical-align: middle; }

.ar-name {
  font-size: 12.5px;
  color: var(--text);
  font-weight: 500;
  margin-right: 6px;
  text-decoration: none;
}
.ar-name:hover {
  color: var(--accent);
  text-decoration: underline;
}

.sport-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--elevated);
  border: 1px solid var(--border-sub);
  color: var(--text-sec);
  white-space: nowrap;
  margin-right: 6px;
}

.sport-tag.nezp {
  background: rgba(255,107,107,0.08);
  border-color: rgba(255,107,107,0.25);
  color: var(--alert);
}

.ar-note {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
}

.ar-beh, .ar-zat {
  font-size: 12px;
  white-space: nowrap;
  padding-right: 16px !important;
}

td.num { text-align: right; }

.c-dz  { color: var(--val-dz); }
.c-fa  { color: var(--val-fa); }
.c-za  { color: var(--race); }
.c-ne  { color: var(--sick); }
.c-beh { color: var(--text); }
.c-zat { color: var(--text); }
.dim   { color: var(--text-muted); }

.state-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--text-muted);
  font-size: 14px;
}

.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.err-txt { color: var(--alert); font-size: 13px; }

/* ── Totals page ─────────────────────────────────────────── */
.totals-wrap { padding: 24px 28px; overflow-x: auto; }
.totals-wrap h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.totals-table { border-collapse: collapse; font-size: 13px; width: 100%; }
.totals-table th, .totals-table td { padding: 7px 12px; border-bottom: 1px solid var(--border-sub); white-space: nowrap; }
.totals-table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); cursor: pointer; user-select: none; text-align: right; }
.totals-table th:first-child { text-align: left; }
.totals-table th.sort-asc::after  { content: ' ▲'; }
.totals-table th.sort-desc::after { content: ' ▼'; }
.totals-table td { text-align: right; font-variant-numeric: tabular-nums; }
.totals-table td:first-child { text-align: left; font-weight: 600; }
.totals-table tr:hover td { background: var(--hover); }
.totals-loading { padding: 40px 28px; color: var(--text-muted); font-size: 13px; }

/* ── Seasons page ────────────────────────────────────────── */
.sz-wrap { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
.sz-wrap::-webkit-scrollbar { width: 5px; }
.sz-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.sz-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 16px; }
.sz-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--elevated); }
.sz-seg button { background: transparent; color: var(--text-sec); border-radius: 0; font-weight: 500; padding: 6px 12px; }
.sz-seg button + button { border-left: 1px solid var(--border); }
.sz-seg button:hover { color: var(--text); box-shadow: none; opacity: 1; background: var(--hover); }
.sz-seg button[aria-pressed="true"] { background: var(--accent); color: #081018; font-weight: 700; }
.sz-fl { display: flex; align-items: center; gap: 8px; color: var(--text-sec); font-size: 12px; }
.sz-fl select {
  font: inherit; font-size: 12px; color: var(--text); background: var(--elevated);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
}
.sz-legend { display: flex; gap: 16px; align-items: center; margin-left: auto; color: var(--text-sec); font-size: 12px; }
.sz-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sz-legend svg { width: 22px; height: 8px; }
.sz-card { background: var(--surface); border: 1px solid var(--border-sub); border-radius: 10px; padding: 14px 16px; }
.sz-dhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 8px; }
.sz-dhead h2 { font-size: 16px; font-weight: 700; }
.sz-pills { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-sec); font-size: 12px; }
.sz-pills b { color: var(--text); font-weight: 600; }
.sz-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.sz-ctitle { font-size: 12px; color: var(--text-sec); margin-bottom: 2px; }
.sz-sec { margin: 22px 0 8px; font-size: 12px; color: var(--text-sec); }
.sz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.sz-mini { padding: 9px 12px 5px; cursor: pointer; }
.sz-mini:hover { border-color: var(--border); }
.sz-mini[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.sz-mini .nm { font-weight: 600; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
.sz-mini .dl { font-weight: 500; color: var(--text-sec); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sz-mini .tot { color: var(--text-sec); font-size: 11.5px; }
.sz-tag {
  margin-left: 6px; font-size: 9.5px; font-weight: 600; padding: 1px 5px; border-radius: 3px;
  color: var(--text-muted); border: 1px solid var(--border); vertical-align: 1px;
}
.sz-table th { position: sticky; top: 0; background: var(--surface); }
.sz-table th, .sz-table td { padding: 7px 12px; border-bottom: 1px solid var(--border-sub); text-align: right; white-space: nowrap; font-size: 12.5px; }
.sz-table th { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.sz-table th:first-child, .sz-table td:first-child { text-align: left; }
.sz-table tbody tr { cursor: pointer; }
.sz-table tbody tr:hover { background: var(--hover); }
.sz-table tbody tr[aria-current="true"] td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.view-sw { display: inline-flex; align-self: flex-start; flex-shrink: 0; margin: 12px 24px;  border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.view-sw button { background: transparent; color: var(--text-sec); border: 0; padding: 5px 14px; font-size: 12px; cursor: pointer; }
.view-sw button.on { background: var(--accent-dim); color: var(--accent); }
.cal-wrap { flex: 1; min-height: 0; padding: 0 24px 40px; overflow-y: auto; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--text-sec); margin-bottom: 14px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend .cd { display: inline-block; width: 14px; height: 14px; aspect-ratio: auto; }
.cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(540px, 100%), 1fr)); gap: 18px; }
.cal-card { background: var(--surface); border: 1px solid var(--border-sub); border-radius: 8px; padding: 14px 16px 16px; }
.cal-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; font-size: 14px; color: var(--text-sec); }
.cal-h b { color: var(--accent); font-size: 17px; }
.cal-h em { margin-left: auto; font-style: normal; color: var(--text); font-variant-numeric: tabular-nums; }
.cal-g { display: grid; grid-template-columns: 34px repeat(7, 1fr) 56px; gap: 5px; align-items: center; }
.cdow { font-size: 12px; color: var(--text-muted); text-align: center; }
.cwk { font-size: 12px; color: var(--text-muted); }
.cwt { font-size: 14px; color: var(--text-sec); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cwt .ne { color: var(--sick); font-size: 11px; margin-right: 6px; }
.cd { position: relative; aspect-ratio: 1; border-radius: 6px; background: var(--week-row); border: 1px solid var(--border-sub); display: flex; flex-direction: column; justify-content: space-between; padding: 4px 6px; box-sizing: border-box; }
.cd .d { font-size: 12px; color: var(--text-muted); line-height: 1; }
.cd .k { font-size: 14px; font-weight: 600; color: var(--bg); line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.cd.l1 { background: rgba(5,217,164,0.25); border-color: transparent; }
.cd.l2 { background: rgba(5,217,164,0.45); border-color: transparent; }
.cd.l3 { background: rgba(5,217,164,0.7);  border-color: transparent; }
.cd.l4 { background: var(--accent);        border-color: transparent; }
.cd.l1 .k, .cd.l2 .k { color: var(--text); }
.cd.l1 .d, .cd.l2 .d, .cd.l3 .d, .cd.l4 .d { color: rgba(12,18,32,0.7); }
.cd.l1 .d, .cd.l2 .d { color: var(--text-sec); }
.cd.other { background: repeating-linear-gradient(135deg, var(--elevated) 0 3px, var(--week-row) 3px 6px); }
.cd.race { box-shadow: inset 0 0 0 2px var(--race); }
.cd.sick::after { content: ''; position: absolute; top: 50%; right: 5px; margin-top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--sick); }
.cd .pips { position: absolute; top: 5px; right: 5px; display: flex; gap: 3px; align-items: center; }
.cd .pips i { width: 8px; height: 8px; border-radius: 2px; box-sizing: border-box; border: 1px solid var(--text); }
.cd .pips i.run { background: var(--text); }
.cd .pips i.nz  { background: var(--alert); border-color: var(--alert); }
.cd .pips b { font-size: 11px; line-height: 1; color: var(--text); }
.cal-legend .pips { position: static; }
.cd.has { cursor: pointer; }
.cd.has:hover { filter: brightness(1.25); }
.cal-h b.nz, .cwk.nz { color: var(--alert); }
#cal-pop { position: fixed; z-index: 60; background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); font-size: 12px; max-width: 360px; }
#cal-pop .ph { color: var(--text-sec); margin-bottom: 6px; }
#cal-pop .pr { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
#cal-pop .pr a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
#cal-pop .pr a:hover { text-decoration: underline; }
#cal-pop .pk { margin-left: auto; color: var(--text-sec); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd.fut { opacity: 0.35; }
.cd.today { outline: 2px solid var(--text); outline-offset: 1px; }
.pv-chart { margin-bottom: 14px; }
.pv-legend { margin: 0 0 6px; }
.pv-sw-bar  { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); }
.pv-sw-line { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--text); }
.pv-strip { white-space: nowrap; }
.pv-chip { display: inline-block; min-width: 26px; margin-left: 4px; padding: 1px 5px; border-radius: 4px; background: var(--hover); color: var(--text-sec); font-size: 11px; text-align: center; }
.pv-chip.gap   { background: rgba(255,107,107,0.18); color: var(--alert); }
.pv-chip.norun { background: rgba(255,200,80,0.18); color: #e0b040; }
.pv-chip.fut   { opacity: 0.4; }
.sz-warn { background: rgba(255,107,107,0.07); border: 1px solid rgba(255,107,107,0.3); color: var(--alert); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; font-size: 12px; }
.sz-warn button { padding: 4px 10px; font-size: 12px; }
.sz-note, .totals-note { color: var(--text-muted); font-size: 11.5px; margin-top: 18px; max-width: 80ch; line-height: 1.6; }
.totals-note { margin: -6px 0 16px; }
#sz-tip {
  position: fixed; z-index: 20; pointer-events: none; display: none; min-width: 130px;
  background: var(--elevated); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4); font-size: 12px;
}
#sz-tip .h { color: var(--text-sec); margin-bottom: 4px; }
#sz-tip .r { display: flex; align-items: center; gap: 8px; }
#sz-tip .r svg { width: 14px; height: 6px; flex: none; }
#sz-tip .r b { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 52px; color: var(--text); }
#sz-tip .r span { color: var(--text-sec); }
</style>
</head>
